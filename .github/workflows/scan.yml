name: scan

on:
  schedule:
    - cron: "*/10 11-21 * * *"   # every 10 minutes, 11:00-21:59 UTC
  workflow_dispatch:             # lets you also start it by hand

permissions:
  contents: write

concurrency:
  group: scan

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan and settle
        run: python scanner.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Update summary
        run: python scanner.py report > summary.txt
      - name: Save results
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update" && git pull --rebase && git push)
